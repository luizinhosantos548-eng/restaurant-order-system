<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍔 Burger House - Sistema de Pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- CABEÇALHO -->
        <header class="header">
            <h1 class="title">🍔 BURGER HOUSE</h1>
            <p class="subtitle">Melhor comida da cidade!</p>
            <div class="admin-button">
                <button class="btn-admin" onclick="goToAdmin()">👨‍💼 Painel do Dono</button>
            </div>
        </header>

        <!-- NAVEGAÇÃO -->
        <nav class="navbar">
            <button class="nav-btn active" onclick="showSection('menu', this)">🍽️ Menu</button>
            <button class="nav-btn" onclick="showSection('cart', this)">🛒 Carrinho <span id="cart-count">0</span></button>
        </nav>

        <!-- SEÇÃO MENU -->
        <section id="menu" class="section active">
            <h2 class="section-title">Nossos Produtos 🤤</h2>
            <div class="menu-grid" id="menu-grid"></div>
        </section>

        <!-- SEÇÃO CARRINHO -->
        <section id="cart" class="section">
            <h2 class="section-title">Seu Pedido 🎉</h2>
            <div class="cart-container">
                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">
                        <div class="empty-cart-emoji">🛒</div>
                        <p>Seu carrinho está vazio!</p>
                    </div>
                </div>
                <div class="cart-summary" id="cart-summary">
                    <p>Nenhum item no carrinho</p>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
